<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>level 18b</title>
    <style>
        body {
            background-color: #080808;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1.level-title {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .box {
            border: 1px solid #222;
            padding: 50px 60px;
            text-align: center;
            background-color: #0c0c0c;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        p.car-name {
            font-size: 1.4rem;
            color: #ffffff;
            letter-spacing: 1px;
            margin: 0 0 15px 0;
        }
        p.sub-text {
            font-size: 1rem;
            color: #a0a0a0;
            letter-spacing: 1px;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1 class="level-title">level 18b</h1>
    <div class="box">
        <p class="car-name">Ford Crown Victoria</p>
        <p class="sub-text">: name of Cars</p>
    </div>
</body>
</html>
