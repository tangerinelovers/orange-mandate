<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>level 18</title>
    <style>
        body {
            background-color: #080808;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1.level-title {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .box {
            border: 1px solid #222;
            padding: 50px 60px;
            text-align: center;
            background-color: #0c0c0c;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        img {
            max-width: 300px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        p.clue-text {
            margin-top: 25px;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <h1 class="level-title">level 18</h1>
    <div class="box">
        <img src="me-when.jpg" alt="me-when">
        <p class="clue-text">find where this is took.</p>
    </div>
</body>
</html>
