<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>level</title>
    <style>
        body {
            background-color: #080808;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            border: 1px solid #222;
            padding: 50px 60px;
            text-align: center;
            background-color: #0c0c0c;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }
        
      
        .image-wrapper {
            position: relative;
            display: inline-block;
            margin: 0 auto;
        }

       
        .covered-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1; /* Sits behind the PNG */
            font-size: 1.2rem;
            color: #ffffff;
            white-space: nowrap;
            user-select: text; 
        }

   
        img {
            max-width: 250px;
            height: auto;
            display: block;
            position: relative;
            z-index: 2;
            margin: 0 auto;
        }

        
        p.south-text {
            margin-top: 25px;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="image-wrapper">
          
            <span class="covered-text">ampersand</span>
            
         
            <img src="blud.png" alt="blud">
        </div>

     
        <p class="south-text">send to maker</p>
    </div>
</body>
</html>
