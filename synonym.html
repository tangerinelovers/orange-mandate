<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>level 17</title>
    <style>
        body {
            background-color: #080808;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1.level-title {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .box {
            border: 1px solid #222;
            padding: 50px 60px;
            text-align: center;
            background-color: #0c0c0c;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .images-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        img {
            max-width: 150px;
            height: auto;
            display: block;
        }
        p.code-line {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #ffffff;
            margin: 10px 0;
        }
        p.sub-code-line {
            font-size: 1rem;
            letter-spacing: 2px;
            color: #a0a0a0;
            margin: 10px 0 0 0;
        }
    </style>
</head>
<body>
    <h1 class="level-title">level 17</h1>
    <div class="box">
        <div class="images-container">
            <img src="guadalajara.png" alt="flag of mexico">
            <img src="tiring.jpg" alt="wheel">
        </div>
        <p class="code-line">6289834662076379735225107123</p>
        <p class="sub-code-line">25 33 60 101</p>
    </div>
</body>
</html>
